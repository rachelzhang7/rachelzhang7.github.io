name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: cancelling mid-deploy can leave
# the live site on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gates as CI. A broken build should never reach the live site
      # just because it was pushed straight to main.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - uses: actions/configure-pages@v6

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: npm run verify

      # No .nojekyll step: Jekyll only runs on the legacy branch-based
      # publishing path, never on an Actions artifact deploy. (And since
      # upload-pages-artifact v4 dotfiles are excluded by default, so a
      # .nojekyll file would not reach the artifact anyway.)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
