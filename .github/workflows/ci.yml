name: CI

# Runs on every pull request, and on pushes to any branch except main.
# Pushes to main are covered by the deploy workflow, which runs the same
# checks before it publishes anything — so this avoids duplicating work.
on:
  pull_request:
  push:
    branches-ignore: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Builds the real static export. This is the check that matters most:
      # static export fails on things `next dev` happily tolerates, such as
      # server-only APIs or dynamic routes without generateStaticParams.
      - name: Build static export
        run: npm run build

      # Catches failures that leave the build green: missing routes, a missing
      # 404.html, /_next/image references that 404 in a static export, and
      # placeholder links leaking to production.
      - name: Verify export output
        run: npm run verify
